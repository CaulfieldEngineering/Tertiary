# Staging & Production Pipeline
# ==========================================================================================


name: Staging & Production Pipeline

# Runs on Pushes to Staging only.  Runs on all tags beginning with 'v'
# ==========================================================================================
on:
  push:
    branches:
      - staging
    tags:
      - 'v*'

jobs:

  # Job: Build
  # ==========================================================================================
  build:
    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        build_type: [Release]
        version: [Full]
        include:
          - os: windows-latest
            cmake_arch: -A x64
          - os: macos-latest
            cmake_arch: -DCMAKE_OSX_ARCHITECTURES=x86_64

    runs-on: ${{ matrix.os }}



    # Checkout Code
    # ==========================================================================================
    steps:
    - name: Checkout code
      uses: actions/checkout@v4



    # Cache Dependencies
    # ==========================================================================================
    # - name: Cache dependencies
    #   id: cache-libs
    #   uses: actions/cache@v4
    #   with:
    #     path: | 
    #       ${{github.workspace}}/libs
    #     key: libs


    # Configure Projects - All Cases
    # ==========================================================================================
    - name: Configure CMake
      run: |
        if [ "${{ matrix.version }}" == "Demo" ]; then
          cmake -S "${{github.workspace}}" -B "${{github.workspace}}/build" -DBUILD_DEMO=ON ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        elif [ "${{ matrix.version }}" == "Full" ]; then
          cmake -S "${{github.workspace}}" -B "${{github.workspace}}/build" -DBUILD_DEMO=OFF ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        else
          echo "Unexpected version: ${{ matrix.version }}"
          exit 1
        fi
      shell: bash


    # Gather project variables from config.cmake - All Cases
    # ==========================================================================================
    - name: Extract and Set Configuration Variables
      run: |
        echo "Reading configuration from config.cmake..."
        while IFS=' ' read -r key value
        do
          value=$(echo $value | tr -d '"')  # Remove quotes
          echo "$key=$value" >> $GITHUB_ENV
        done < <(grep 'set(w' ${GITHUB_WORKSPACE}/config.cmake | sed -e 's/set(//g' -e 's/)//g' -e 's/\s\+/ /g')
      shell: bash
      

    # Confirm Tag is of Production Branch, and not Staging - Tag Only
    # ==========================================================================================
    - name: Ensure Tag is on Production Branch
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        git fetch origin production
        TAG_COMMIT=$(git rev-parse HEAD)
        if git merge-base --is-ancestor $TAG_COMMIT origin/production; then
          echo "✓ Tag commit is part of production branch history."
        else
          echo "::error::Tag commit is NOT based on production branch. Aborting."
          exit 1
        fi


    # Confirm GitHub Tag Matches config.cmake tag - Tags Only
    # ==========================================================================================
    - name: Verify Tag Version Matches Config Version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        echo "GitHub Tag Version: $TAG_VERSION"
        echo "config.cmake Version: $wPROJECT_VERSION"
        
        if [ "$TAG_VERSION" != "$wPROJECT_VERSION" ]; then
          echo "::error::Tag version ($TAG_VERSION) does not match config.cmake version ($wPROJECT_VERSION)."
          exit 1
        fi
    
        echo "✓ Tag and config.cmake versions match"
    

# Confirm New Tag is Greater than Previous tags - Tags Only
# ==========================================================================================
    - name: Ensure New Tag is Greater Than Previous Tags
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        NEW_VERSION="${GITHUB_REF#refs/tags/v}"
        echo "New Tag Version: $NEW_VERSION"
        
        # Fetch all tags with full history
        git fetch --prune --tags --force
        
        # Get only the current active tags (not deleted ones)
        CURRENT_TAGS=$(git tag -l "v*" | sed 's/^v//' | sort -V)
        
        echo "Current active tags:"
        echo "$CURRENT_TAGS"
        
        # Skip the duplicate check entirely - we're pushing a new tag
        # and it's valid because GitHub allows it to exist
        
        # If there are no tags, first tag is valid
        if [ -z "$CURRENT_TAGS" ]; then
          echo "✓ This is the first tag in the repository"
          exit 0
        fi
        
        # Get highest version from current active tags
        HIGHEST_VERSION=$(echo "$CURRENT_TAGS" | tail -n 1)
        
        echo "Highest Existing Version: $HIGHEST_VERSION"
        
        # Compare versions
        if [ "$(printf "%s\n" "$HIGHEST_VERSION" "$NEW_VERSION" | sort -V | tail -n 1)" != "$NEW_VERSION" ]; then
          echo "::error::New tag version ($NEW_VERSION) is not greater than the previous highest ($HIGHEST_VERSION)."
          exit 1
        fi
        
        echo "✓ New version is greater than all previous tags"
  

    # Compile Executables - All Cases
    # ==========================================================================================
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build_type }}


    # Production Testing
    # ==========================================================================================
    - name: Run Tests
      run: |
        echo "TODO: Insert test runner here"


    # Debug; print project variables - All Cases
    # ==========================================================================================
    - name: Use Variables
      run: |
        echo "Plugin Name: $wPLUGIN_NAME"
        echo "Company Name: $wCOMPANY_NAME"
        echo "Project Version: $wPROJECT_VERSION"
        echo "Manufacturer Code: $wPLUGIN_MANUFACTURER_CODE"
        echo "Formats: $wFORMATS"
        echo "Is Synth: $wIS_SYNTH"
        echo "Needs MIDI Input: $wNEEDS_MIDI_INPUT"
        echo "Needs MIDI Output: $wNEEDS_MIDI_OUTPUT"
        echo "Plugin Code: $wPLUGIN_CODE"


    # Install Inno Setup (Windows Only) - All Cases
    # ==========================================================================================
    - name: Install Inno Setup (Windows Only)
      if: matrix.os == 'windows-latest'
      run: choco install innosetup --yes


    # Compile Inno Setup script (Windows Only) - All Cases
    # ==========================================================================================
    - name: Compile Inno Setup script (Windows Only)
      if: matrix.os == 'windows-latest'
      run: |
        & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "${{github.workspace}}\build\installer_win.iss"
      shell: pwsh


    # Check for required signing secrets - All Cases
    # ==========================================================================================
    - name: Check Required Secrets
      id: check_secrets
      shell: bash
      run: |
        if [ -z "${{ secrets.AZURE_TENANT_ID }}" ] || [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -z "${{ secrets.AZURE_CLIENT_SECRET }}" ] || [ -z "${{ secrets.AZURE_ENDPOINT }}" ] || [ -z "${{ secrets.AZURE_CODE_SIGNING_NAME }}" ] || [ -z "${{ secrets.AZURE_CERT_PROFILE_NAME }}" ]; then
          echo "Required secrets for Azure signing are not set. Skipping signing step."
          echo "proceed=false" >> $GITHUB_OUTPUT
        else
          echo "proceed=true" >> $GITHUB_OUTPUT
        fi


    # Sign the Windows Installer Executable using Azure Trusted Signing - All Cases
    # ==========================================================================================
    - name: Sign Windows Installer (Azure)
      if: ${{ matrix.os == 'windows-latest' && steps.check_secrets.outputs.proceed == 'true' }}
      uses: azure/trusted-signing-action@v0.5.0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ secrets.AZURE_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
        certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        files-folder: ${{ github.workspace }}/build
        files-folder-filter: exe
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256


    # Sign Payload (Mac) - 2024.10.25 - All Cases
    # ==========================================================================================
    - name: Sign Mac Binaries
      if: matrix.os == 'macos-latest'
      env:
        APPLICATION_CERTIFICATE_BASE64: ${{ secrets.MAC_APPLICATION_CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      run: |
        # Check for required secrets
        if [ -z "$APPLICATION_CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
          echo "Required secrets for application signing are not set. Skipping application signing step."
          exit 0
        fi

        echo "Starting the signing process for macOS binaries..."

        # Create temporary keychain
        # ====================================
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Import certificate to keychain
        # ====================================
        echo -n "$APPLICATION_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH"
        security default-keychain -s "$KEYCHAIN_PATH"
        
        # Add certificate to partition list
        # ====================================
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        echo "Signing VST3 bundle..."
        # ====================================
        VST3_PATH="${GITHUB_WORKSPACE}/build/plugin/${REPOSITORY_NAME}_artefacts/Release/VST3/${REPOSITORY_NAME}.vst3"
        codesign --force \
          --sign "Developer ID Application" \
          --verbose \
          --deep --strict --options=runtime --timestamp \
          "$VST3_PATH"

        echo "Verifying VST3 signature..."
        # ====================================
        codesign --verify --deep --verbose=2 "$VST3_PATH"
        # Only verify code signature, skip notarization check
        codesign --display --verbose=2 "$VST3_PATH"

        echo "Signing standalone application..."
        # ====================================
        APP_PATH="${GITHUB_WORKSPACE}/build/plugin/${REPOSITORY_NAME}_artefacts/Release/Standalone/${REPOSITORY_NAME}.app"
        codesign --force \
          --sign "Developer ID Application" \
          --verbose \
          --deep --strict --options=runtime --timestamp \
          "$APP_PATH"

        echo "Verifying standalone application signature..."
        # ====================================
        codesign --verify --deep --verbose=2 "$APP_PATH"
        # Only verify code signature, skip notarization check
        codesign --display --verbose=2 "$APP_PATH"

        # Clean up
        # ====================================
        security default-keychain -s login.keychain
        security delete-keychain "$KEYCHAIN_PATH"
        rm "$RUNNER_TEMP/cert.p12"

        echo "Signing process completed successfully."


    # Package: Standalone (Mac) - All Cases
    # ==========================================================================================
    - name: Create Standalone Package (Mac Only)
      if: matrix.os == 'macos-latest'
      env:
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      run: |
        # Create output directory
        mkdir -p ${GITHUB_WORKSPACE}/build/output
    
        # Format COMPANY_NAME by removing spaces
        FORMATTED_COMPANY_NAME=$(echo "$wCOMPANY_NAME" | tr -d ' ')

        # Determine the suffix based on the version
        SUFFIX=""
        if [[ "${{ matrix.version }}" == "Demo" ]]; then
          SUFFIX=".D"
        fi

        # Define paths
        APP_PATH="${GITHUB_WORKSPACE}/build/plugin/${REPOSITORY_NAME}_artefacts/Release/Standalone/${REPOSITORY_NAME}.app"
        PKG_PATH="${GITHUB_WORKSPACE}/build/output/${REPOSITORY_NAME}_Standalone_${wPROJECT_VERSION}${SUFFIX}.pkg"

        echo "Checking for standalone app before packaging..."
        if [ ! -d "$APP_PATH" ]; then
          echo "ERROR: Standalone app not found at: $APP_PATH"
          echo "Contents of $(dirname "$APP_PATH"):"
          ls -la "$(dirname "$APP_PATH")"
          exit 1
        fi

        echo "✓ Found standalone app at: $APP_PATH"
        echo "Creating standalone package..."

        pkgbuild \
          --root "$(dirname "$APP_PATH")" \
          --identifier "com.${FORMATTED_COMPANY_NAME}.${REPOSITORY_NAME}.app" \
          --version "$wPROJECT_VERSION" \
          --install-location "/Applications/${REPOSITORY_NAME}" \
          "$PKG_PATH"

        # Verify package was created and is not empty
        if [ ! -f "$PKG_PATH" ]; then
          echo "ERROR: Package was not created at: $PKG_PATH"
          exit 1
        fi

        if [ ! -s "$PKG_PATH" ]; then
          echo "ERROR: Created package is empty: $PKG_PATH"
          exit 1
        fi

        echo "✓ Successfully created standalone package at: $PKG_PATH"
        

    # Package: VST3 (Mac) - All Cases
    # ==========================================================================================
    - name: Create VST3 Package (Mac Only)
      if: matrix.os == 'macos-latest'
      env:
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      run: |
        # Create output directory
        mkdir -p ${GITHUB_WORKSPACE}/build/output

        # Format COMPANY_NAME by removing spaces
        FORMATTED_COMPANY_NAME=$(echo "$wCOMPANY_NAME" | tr -d ' ')

        # Determine the suffix based on the version
        SUFFIX=""
        if [[ "${{ matrix.version }}" == "Demo" ]]; then
          SUFFIX=".D"
        fi

        # Define paths
        VST3_PATH="${GITHUB_WORKSPACE}/build/plugin/${REPOSITORY_NAME}_artefacts/Release/VST3/${REPOSITORY_NAME}.vst3"
        PKG_PATH="${GITHUB_WORKSPACE}/build/output/${REPOSITORY_NAME}_VST3_${wPROJECT_VERSION}${SUFFIX}.pkg"

        echo "Checking for VST3 bundle before packaging..."
        if [ ! -d "$VST3_PATH" ]; then
          echo "ERROR: VST3 bundle not found at: $VST3_PATH"
          echo "Contents of $(dirname "$VST3_PATH"):"
          ls -la "$(dirname "$VST3_PATH")"
          exit 1
        fi

        echo "✓ Found VST3 bundle at: $VST3_PATH"
        echo "Creating VST3 package..."

        pkgbuild \
          --root "$(dirname "$VST3_PATH")" \
          --identifier "com.${FORMATTED_COMPANY_NAME}.${REPOSITORY_NAME}.vst3" \
          --version "$wPROJECT_VERSION" \
          --install-location "/Library/Audio/Plug-Ins/VST3" \
          "$PKG_PATH"

        # Verify package was created and is not empty
        if [ ! -f "$PKG_PATH" ]; then
          echo "ERROR: Package was not created at: $PKG_PATH"
          exit 1
        fi

        if [ ! -s "$PKG_PATH" ]; then
          echo "ERROR: Created package is empty: $PKG_PATH"
          exit 1
        fi

        echo "✓ Successfully created VST3 package at: $PKG_PATH"
          

    # Sign Individual Packages (Mac) - 2024.10.25 CLAUDE - All Cases
    # ==========================================================================================
    - name: Sign Individual Packages
      if: matrix.os == 'macos-latest'
      env:
        INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      run: |
        # Check for required secrets
        if [ -z "$INSTALLER_CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
          echo "Required secrets for installer signing are not set. Skipping installer signing step."
          exit 0
        fi

        echo "Starting the package signing process..."

        # Create temporary keychain
        # ====================================
        KEYCHAIN_PATH=$RUNNER_TEMP/pkg-signing.keychain-db
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Import certificate to keychain
        # ====================================
        echo -n "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH"
        security default-keychain -s "$KEYCHAIN_PATH"
        
        # Add certificate to partition list
        # ====================================
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Determine the suffix based on the version
        SUFFIX=""
        if [[ "${{ matrix.version }}" == "Demo" ]]; then
          SUFFIX=".D"
        fi

        echo "Signing standalone package..."
        # ====================================
        STANDALONE_PKG="${GITHUB_WORKSPACE}/build/output/${REPOSITORY_NAME}_Standalone_${wPROJECT_VERSION}${SUFFIX}.pkg"
        productsign --sign "Developer ID Installer" \
          "$STANDALONE_PKG" \
          "${STANDALONE_PKG%.pkg}_signed.pkg"

        echo "Verifying standalone package signature..."
        # ====================================
        pkgutil --check-signature "${STANDALONE_PKG%.pkg}_signed.pkg"

        echo "Signing VST3 package..."
        # ====================================
        VST3_PKG="${GITHUB_WORKSPACE}/build/output/${REPOSITORY_NAME}_VST3_${wPROJECT_VERSION}${SUFFIX}.pkg"
        productsign --sign "Developer ID Installer" \
          "$VST3_PKG" \
          "${VST3_PKG%.pkg}_signed.pkg"

        echo "Verifying VST3 package signature..."
        # ====================================
        pkgutil --check-signature "${VST3_PKG%.pkg}_signed.pkg"

        # Replace unsigned with signed packages
        # ====================================
        mv "${STANDALONE_PKG%.pkg}_signed.pkg" "$STANDALONE_PKG"
        mv "${VST3_PKG%.pkg}_signed.pkg" "$VST3_PKG"

        # Clean up
        # ====================================
        security default-keychain -s login.keychain
        security delete-keychain "$KEYCHAIN_PATH"
        rm "$RUNNER_TEMP/cert.p12"

        echo "Package signing process completed successfully."


    # Package: Distribution (Mac) - All Cases
    # ==========================================================================================
    - name: Create Distribution Package (Mac Only)
      if: matrix.os == 'macos-latest'
      env:
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/build/output

        # Determine the suffix and distribution file based on the version
        SUFFIX=""
        DIST_FILE="distribution-full.xml"
        
        if [[ "${{ matrix.version }}" == "Demo" ]]; then
          SUFFIX=".D"
          DIST_FILE="distribution-demo.xml"
        fi

        # Copy the appropriate distribution file
        echo "Using distribution file: $DIST_FILE"
        if [ ! -f "${{github.workspace}}/build/$DIST_FILE" ]; then
          echo "ERROR: Distribution file not found: $DIST_FILE"
          echo "Contents of build directory:"
          ls -la ${{github.workspace}}/build/
          exit 1
        fi

        # Copy and verify
        cp "${{github.workspace}}/build/$DIST_FILE" "${GITHUB_WORKSPACE}/build/output/distribution.xml"
        if [ ! -f "${GITHUB_WORKSPACE}/build/output/distribution.xml" ]; then
          echo "ERROR: Failed to copy distribution file"
          exit 1
        fi
        echo "✓ Distribution file copied successfully"

        # Verify package path contains our packages
        echo "Checking for component packages..."
        ls -la ${GITHUB_WORKSPACE}/build/output/*.pkg
        
        echo "Creating distribution package..."
        productbuild \
          --distribution "${GITHUB_WORKSPACE}/build/output/distribution.xml" \
          --package-path "${GITHUB_WORKSPACE}/build/output" \
          "${{github.workspace}}/build/${REPOSITORY_NAME}MacInstaller_${wPROJECT_VERSION}${SUFFIX}.pkg"

        # Verify the final package was created
        if [ ! -f "${{github.workspace}}/build/${REPOSITORY_NAME}MacInstaller_${wPROJECT_VERSION}${SUFFIX}.pkg" ]; then
          echo "ERROR: Failed to create distribution package"
          exit 1
        fi
        
        echo "✓ Distribution package created successfully"
        
      shell: bash


    # Sign Distribution Package (Mac) - All Cases
    # ==========================================================================================
    - name: Sign Distribution Package
      if: matrix.os == 'macos-latest'
      env:
        INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
        CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      run: |
        # Check for required secrets
        if [ -z "$INSTALLER_CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
          echo "Required secrets for installer signing are not set. Skipping installer signing step."
          exit 0
        fi

        echo "Starting the distribution package signing process..."

        # Create temporary keychain
        # ====================================
        KEYCHAIN_PATH=$RUNNER_TEMP/dist-signing.keychain-db
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Import certificate to keychain
        # ====================================
        echo -n "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH"
        security default-keychain -s "$KEYCHAIN_PATH"
        
        # Add certificate to partition list
        # ====================================
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Determine the suffix based on the version
        SUFFIX=""
        if [[ "${{ matrix.version }}" == "Demo" ]]; then
          SUFFIX=".D"
        fi

        # Sign the distribution package
        UNSIGNED_PKG="${GITHUB_WORKSPACE}/build/${REPOSITORY_NAME}MacInstaller_${wPROJECT_VERSION}${SUFFIX}.pkg"
        SIGNED_PKG="${GITHUB_WORKSPACE}/build/${REPOSITORY_NAME}MacInstaller_${wPROJECT_VERSION}${SUFFIX}_signed.pkg"

        echo "Signing distribution package..."
        productsign --sign "Developer ID Installer" \
          "$UNSIGNED_PKG" \
          "$SIGNED_PKG"

        # Verify the signature
        echo "Verifying package signature..."
        pkgutil --check-signature "$SIGNED_PKG"

        # Replace unsigned with signed package
        mv "$SIGNED_PKG" "$UNSIGNED_PKG"

        # Clean up
        security default-keychain -s login.keychain
        security delete-keychain "$KEYCHAIN_PATH"
        rm "$RUNNER_TEMP/cert.p12"

        echo "Distribution package signing completed successfully."


    # Notarize the Distribution Package (Mac) - 2024.10.25 CLAUDE - All Cases
    # ==========================================================================================
    - name: Notarize Mac Distribution Package
      if: matrix.os == 'macos-latest'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      run: |
        # Check for required secrets
        if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
          echo "Required secrets for notarization are not set. Skipping notarization step."
          exit 0
        fi

        echo "Starting the notarization process..."

        # Determine the suffix based on the version
        SUFFIX=""
        if [[ "${{ matrix.version }}" == "Demo" ]]; then
          SUFFIX=".D"
        fi

        # Store the installer path
        INSTALLER_PATH="${GITHUB_WORKSPACE}/build/${REPOSITORY_NAME}MacInstaller_${wPROJECT_VERSION}${SUFFIX}.pkg"

        # Create temporary keychain for notarization
        xcrun notarytool store-credentials "notarytool-profile" \
          --apple-id "$APPLE_ID" \
          --team-id "$APPLE_TEAM_ID" \
          --password "$APPLE_APP_SPECIFIC_PASSWORD"

        # Submit for notarization and capture the submission ID
        echo "Submitting for notarization..."
        SUBMISSION_RESPONSE=$(xcrun notarytool submit "$INSTALLER_PATH" --keychain-profile "notarytool-profile")
        SUBMISSION_ID=$(echo "$SUBMISSION_RESPONSE" | grep "id:" | head -n 1 | awk '{print $2}')

        if [ -z "$SUBMISSION_ID" ]; then
          echo "Failed to get submission ID"
          echo "Full submission response: $SUBMISSION_RESPONSE"
          exit 1
        fi

        echo "Captured Submission ID: $SUBMISSION_ID"

        # Add a timeout counter
        ATTEMPTS=0
        MAX_ATTEMPTS=30  # 15 minutes maximum (30 * 30 seconds)

        # Wait and check status
        while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
          echo "Checking status for submission ID: $SUBMISSION_ID"
          STATUS_RESPONSE=$(xcrun notarytool info "$SUBMISSION_ID" --keychain-profile "notarytool-profile")
          echo "Full status response: $STATUS_RESPONSE"
          
          STATUS=$(echo "$STATUS_RESPONSE" | grep "status:" | awk '{print $2}')
          echo "Parsed status: $STATUS"
          
          if [ "$STATUS" = "Accepted" ]; then
            echo "Notarization successful!"
            break
          elif [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
            echo "Notarization failed with status: $STATUS"
            xcrun notarytool log "$SUBMISSION_ID" --keychain-profile "notarytool-profile"
            exit 1
          fi
          
          ATTEMPTS=$((ATTEMPTS + 1))
          if [ $ATTEMPTS -eq $MAX_ATTEMPTS ]; then
            echo "Timeout waiting for notarization after 15 minutes"
            exit 1
          fi
          
          echo "Waiting for notarization to complete... (Attempt $ATTEMPTS of $MAX_ATTEMPTS)"
          sleep 30
        done

        # Show notarization history for debugging
        xcrun notarytool history --keychain-profile "notarytool-profile"
        

    # Staple the Notarization Ticket to Distribution Package (Mac) - 2024.10.25 CLAUDE - All Cases
    # ==========================================================================================
    - name: Staple Notarization Ticket
      if: matrix.os == 'macos-latest'
      env:
        REPOSITORY_NAME: ${{ github.event.repository.name }}
        APPLE_ID: ${{ secrets.APPLE_ID }}  # Used to check if notarization was run
      run: |
        # Check if notarization was meant to run
        if [ -z "$APPLE_ID" ]; then
          echo "Notarization credentials not set. Skipping stapling step."
          exit 0
        fi
    
        # Determine the suffix based on the version
        SUFFIX=""
        if [[ "${{ matrix.version }}" == "Demo" ]]; then
          SUFFIX=".D"
        fi
    
        # Store the installer path
        INSTALLER_PATH="${GITHUB_WORKSPACE}/build/${REPOSITORY_NAME}MacInstaller_${wPROJECT_VERSION}${SUFFIX}.pkg"
    
        echo "Stapling notarization ticket to installer..."
        xcrun stapler staple "$INSTALLER_PATH"
    
        echo "Validating stapled installer..."
        xcrun stapler validate "$INSTALLER_PATH"
    
        # Additional verification
        spctl --assess --type install "$INSTALLER_PATH"
    
        echo "Stapling process completed successfully."


    # UPLOAD ARTIFACTS - All Cases
    # ==========================================================================================
    - name: Upload Final Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-installer
        path: |
          build/*Installer_*.pkg
          build/*Installer_*.exe


    # Upload Installers to WordPress Media Library - Tag Only
    # ==========================================================================================
    - name: Upload Installers to WordPress
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
        WORDPRESS_APPLICATION_PASSWORD: ${{ secrets.WORDPRESS_APPLICATION_PASSWORD }}
        WORDPRESS_SITE: ${{ secrets.WORDPRESS_SITE }}
      shell: bash
      run: |
        set -e  # Exit immediately if any command exits with a non-zero status

        # Function to URL encode a string
        urlencode() {
          local string="${1}"
          local strlen=${#string}
          local encoded=""
          local pos c o
          for (( pos=0 ; pos<strlen ; pos++ )); do
            c=${string:$pos:1}
            case "$c" in
              [-_.~a-zA-Z0-9]) o="${c}" ;;
              *) printf -v o '%%%02x' "'$c"
            esac
            encoded+="${o}"
          done
          echo "${encoded}"
        }

        # Check if WordPress credentials are set
        if [ -z "$WORDPRESS_USERNAME" ] || [ -z "$WORDPRESS_APPLICATION_PASSWORD" ] || [ -z "$WORDPRESS_SITE" ]; then
          echo "WordPress credentials not set. Skipping WordPress upload step."
          exit 0
        fi

        # Extract repository name
        REPO_NAME=$(echo $GITHUB_REPOSITORY | awk -F / '{print $2}')
        
        # Set file paths and titles based on OS
        if [ "${{ matrix.os }}" == "macos-latest" ]; then
          FILE_PATH="${GITHUB_WORKSPACE}/build/${REPO_NAME}MacInstaller_${wPROJECT_VERSION}.pkg"
          FILE_TITLE="Tertiary Installer v${wPROJECT_VERSION} for Mac"
          FILE_NAME="${REPO_NAME}MacInstaller_${wPROJECT_VERSION}.pkg"
        elif [ "${{ matrix.os }}" == "windows-latest" ]; then
          FILE_PATH="${GITHUB_WORKSPACE}/build/${REPO_NAME}WinInstaller_${wPROJECT_VERSION}.exe"
          FILE_TITLE="Tertiary Installer v${wPROJECT_VERSION} for Windows"
          FILE_NAME="${REPO_NAME}WinInstaller_${wPROJECT_VERSION}.exe"
        else
          echo "Unsupported OS for WordPress upload"
          exit 1
        fi

        # Check if file exists
        if [ ! -f "$FILE_PATH" ]; then
          echo "File not found: $FILE_PATH"
          exit 1
        fi

        # Search for existing file
        ENCODED_TITLE=$(urlencode "$FILE_TITLE")
        echo "Searching for existing file with title: $FILE_TITLE"
        EXISTING_FILE_RESPONSE=$(curl -s -X GET "${WORDPRESS_SITE}/wp-json/wp/v2/media?search=${ENCODED_TITLE}" \
          -u "$WORDPRESS_USERNAME:$WORDPRESS_APPLICATION_PASSWORD")
        EXISTING_FILE_ID=$(echo "$EXISTING_FILE_RESPONSE" | jq -r '.[] | select(.title.rendered == "'"$FILE_TITLE"'") | .id')

        # Delete existing file if found
        if [ -n "$EXISTING_FILE_ID" ]; then
          echo "Existing file found with ID: $EXISTING_FILE_ID. Deleting..."
          DELETE_RESPONSE=$(curl -s -X DELETE "${WORDPRESS_SITE}/wp-json/wp/v2/media/${EXISTING_FILE_ID}?force=true" \
            -u "$WORDPRESS_USERNAME:$WORDPRESS_APPLICATION_PASSWORD")
          
          if echo "$DELETE_RESPONSE" | jq -e '.deleted == true' > /dev/null; then
            echo "Existing file successfully deleted."
          else
            echo "Failed to delete existing file. Response: $DELETE_RESPONSE"
            exit 1
          fi
        else
          echo "No existing file found with the exact title."
        fi

        # Upload new file to WordPress Media Library
        echo "Uploading new file to WordPress Media Library..."
        UPLOAD_RESPONSE=$(curl -s -X POST "${WORDPRESS_SITE}/wp-json/wp/v2/media" \
          -u "$WORDPRESS_USERNAME:$WORDPRESS_APPLICATION_PASSWORD" \
          -H "Content-Disposition: attachment; filename=$(basename "$FILE_PATH")" \
          -F "file=@${FILE_PATH}" \
          -F "title=${FILE_TITLE}" \
          -F "alt_text=${REPO_NAME} Installer" \
          -F "caption=Installer for ${REPO_NAME} v${wPROJECT_VERSION}" \
          -F "description=${FILE_TITLE}")

        # Check upload response and extract URL
        if echo "$UPLOAD_RESPONSE" | jq -e '.id' > /dev/null; then
          echo "PASS: File successfully uploaded to WordPress Media Library."
          FILE_URL=$(echo "$UPLOAD_RESPONSE" | jq -r '.source_url')
        else
          echo "FAIL: Upload failed. Response: $UPLOAD_RESPONSE"
          exit 1
        fi

        echo "Uploaded file URL: $FILE_URL"

        # Extract and save URL root path
        URL_ROOT_PATH=$(dirname "$FILE_URL")
        echo "URL root path: $URL_ROOT_PATH"
        echo "URL_ROOT_PATH=$URL_ROOT_PATH" >> $GITHUB_ENV
        

    # Update the Download Redirect URLs - Tag Only
    # Interfaces with the WordPress "Redirection" Plugin
    # ==========================================================================================
    - name: Update Download Redirect URLs
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
        WORDPRESS_APPLICATION_PASSWORD: ${{ secrets.WORDPRESS_APPLICATION_PASSWORD }}
        WORDPRESS_SITE_URL: ${{ secrets.WORDPRESS_SITE }}
      shell: bash
      run: |
        set -e  # Exit immediately if any command exits with a non-zero status
        echo "Starting update of download redirect URLs in WordPress..."
        
        # Validate required variables
        if [ -z "$WORDPRESS_USERNAME" ] || [ -z "$WORDPRESS_APPLICATION_PASSWORD" ] || [ -z "$WORDPRESS_SITE_URL" ]; then
          echo "Error: Missing WordPress credentials or site URL."
          exit 0
        fi
        
        # Fetch and debug group response
        echo "Fetching default group ID..."
        GROUP_RESPONSE=$(curl -s -X GET "${WORDPRESS_SITE_URL}/wp-json/redirection/v1/group" \
          -u "$WORDPRESS_USERNAME:$WORDPRESS_APPLICATION_PASSWORD")
        echo "Raw group response: $GROUP_RESPONSE"
        
        # Extract default group ID based on response structure
        DEFAULT_GROUP=$(echo "$GROUP_RESPONSE" | jq -r '.items[0].id')
        if [ -z "$DEFAULT_GROUP" ]; then
          echo "Error: Failed to retrieve default group ID."
          exit 1
        fi
        echo "Default group ID: $DEFAULT_GROUP"
        
        # Get repository name in both cases
        REPO_NAME=$(echo $GITHUB_REPOSITORY | awk -F / '{print $2}')
        REPO_NAME_LOWER=$(echo $REPO_NAME | tr '[:upper:]' '[:lower:]')
        
        # Construct destination URLs (keeping original case for file names)
        FILE_URL_MAC="${URL_ROOT_PATH}/${REPO_NAME}MacInstaller_${wPROJECT_VERSION}.pkg"
        FILE_URL_WIN="${URL_ROOT_PATH}/${REPO_NAME}WinInstaller_${wPROJECT_VERSION}.exe"
        
        # Construct Source URLs (in lowercase)
        SOURCE_URL_MAC="/${REPO_NAME_LOWER}-download-mac"
        SOURCE_URL_WIN="/${REPO_NAME_LOWER}-download-windows"
        
        # Function to update or create redirect
        update_redirect() {
          local source_url=$1
          local target_url=$2
          
          echo "Processing redirect for ${source_url}"
          
          # First, try to find existing redirect
          echo "Checking for existing redirect..."
          EXISTING_REDIRECT=$(curl -s -X GET "${WORDPRESS_SITE_URL}/wp-json/redirection/v1/redirect?search=${source_url}" \
            -u "$WORDPRESS_USERNAME:$WORDPRESS_APPLICATION_PASSWORD")
          
          # Extract redirect ID if it exists
          REDIRECT_ID=$(echo "$EXISTING_REDIRECT" | jq -r '.items[] | select(.url=="'"${source_url}"'") | .id')
          
          if [ ! -z "$REDIRECT_ID" ]; then
            echo "Found existing redirect (ID: ${REDIRECT_ID}). Updating..."
            RESPONSE=$(curl -s -X POST "${WORDPRESS_SITE_URL}/wp-json/redirection/v1/redirect/${REDIRECT_ID}" \
              -u "$WORDPRESS_USERNAME:$WORDPRESS_APPLICATION_PASSWORD" \
              -H "Content-Type: application/json" \
              -d '{
                "url": "'"${source_url}"'",
                "action_data": {
                  "url": "'"${target_url}"'",
                  "code": 301
                },
                "match_type": "url",
                "action_type": "url",
                "regex": false,
                "status": "enabled",
                "group_id": '"${DEFAULT_GROUP}"'
              }')
          else
            echo "No existing redirect found. Creating new one..."
            RESPONSE=$(curl -s -X POST "${WORDPRESS_SITE_URL}/wp-json/redirection/v1/redirect" \
              -u "$WORDPRESS_USERNAME:$WORDPRESS_APPLICATION_PASSWORD" \
              -H "Content-Type: application/json" \
              -d '{
                "url": "'"${source_url}"'",
                "action_data": {
                  "url": "'"${target_url}"'",
                  "code": 301
                },
                "match_type": "url",
                "action_type": "url",
                "regex": false,
                "status": "enabled",
                "group_id": '"${DEFAULT_GROUP}"'
              }')
          fi
          
          # Check for errors in response
          if echo "$RESPONSE" | jq -e 'has("code")' > /dev/null; then
            echo "Error in API response: $RESPONSE"
            return 1
          fi
          
          echo "Successfully processed redirect for ${source_url}"
        }
        
        # Update redirections
        update_redirect "$SOURCE_URL_MAC" "$FILE_URL_MAC"
        update_redirect "$SOURCE_URL_WIN" "$FILE_URL_WIN"
        
        echo "Redirect URLs updated successfully."





    # Check SSH Credentials Available
    # ==========================================================================================
    - name: Check SSH Credentials
      id: check_ssh
      shell: bash
      run: |
        if [ -z "${{ secrets.SSH_ID }}" ] || [ "${{ secrets.SSH_ID }}" = "SKIP" ]; then
          echo "ssh_available=false" >> $GITHUB_OUTPUT
          echo "SSH credentials not set or set to SKIP. Skipping SSH-related steps."
        else
          echo "ssh_available=true" >> $GITHUB_OUTPUT
        fi


    # Setup SSH for Server Upload
    # ==========================================================================================
    - name: Setup SSH
      if: steps.check_ssh.outputs.ssh_available == 'true'
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_ID }}


    # Add Host Key
    # ==========================================================================================
    - name: Add Host Key
      if: steps.check_ssh.outputs.ssh_available == 'true'
      shell: bash
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -p 7822 CaulfieldEngineering.com >> ~/.ssh/known_hosts


    # Create SSH Config
    # ==========================================================================================
    - name: Create SSH Config
      if: steps.check_ssh.outputs.ssh_available == 'true'
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "Host CaulfieldEngineering.com
          HostName CaulfieldEngineering.com
          User caulfiel
          Port 7822
          MACs hmac-sha2-256
          StrictHostKeyChecking no" > ~/.ssh/config


    # Upload Installer to Server (SCP)
    # ==========================================================================================
    - name: Upload Installer to Server (SCP)
      if: steps.check_ssh.outputs.ssh_available == 'true'
      env:
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      shell: bash
      run: |
        set -e  # Exit immediately if any command exits with a non-zero status

        echo "SSH credentials available. Starting installer upload..."

        REPO_NAME=$(echo $GITHUB_REPOSITORY | awk -F / '{print $2}')
        echo "REPO_NAME set to: $REPO_NAME"

        # Set destination path (root of plugin directory, alongside uploads/)
        DEST_PATH="/home/caulfiel/public_html/plug-ins/${REPO_NAME}/"
        SERVER="CaulfieldEngineering.com"

        echo "Checking if destination directory exists on the server..."
        if ssh $SERVER "test -d $DEST_PATH"; then
          echo "Directory exists: $DEST_PATH"
        else
          echo "Directory does not exist, creating directory: $DEST_PATH"
          if ssh $SERVER "mkdir -p $DEST_PATH"; then
            echo "Directory created successfully"
          else
            echo "Failed to create directory: $DEST_PATH"
            exit 1
          fi
        fi

        # Upload installer for current OS
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          INSTALLER_PATH="${GITHUB_WORKSPACE}/build/${REPO_NAME}WinInstaller_${wPROJECT_VERSION}.exe"
          INSTALLER_NAME="${REPO_NAME}WinInstaller_${wPROJECT_VERSION}.exe"
        elif [ "${{ matrix.os }}" == "macos-latest" ]; then
          INSTALLER_PATH="${GITHUB_WORKSPACE}/build/${REPO_NAME}MacInstaller_${wPROJECT_VERSION}.pkg"
          INSTALLER_NAME="${REPO_NAME}MacInstaller_${wPROJECT_VERSION}.pkg"
        else
          echo "Unsupported OS for installer upload"
          INSTALLER_PATH=""
        fi

        if [ -n "$INSTALLER_PATH" ] && [ -f "$INSTALLER_PATH" ]; then
          echo "✓ Found installer: $INSTALLER_NAME"
          echo "Uploading installer to: $SERVER:$DEST_PATH"
          
          if scp "$INSTALLER_PATH" "$SERVER:$DEST_PATH$INSTALLER_NAME"; then
            echo "✓ Installer uploaded successfully: $INSTALLER_NAME"
          else
            echo "ERROR: Installer upload failed with exit code $?"
            exit 1
          fi
        else
          echo "ERROR: Installer not found at: $INSTALLER_PATH"
          exit 1
        fi

        echo "Installer deployed to: https://caulfieldengineering.com/plug-ins/${REPO_NAME}/${INSTALLER_NAME}"







    # Install GitHub CLI - Tag Only
    # ==========================================================================================
    - name: Install GitHub CLI
      if: failure() && startsWith(github.ref, 'refs/tags/v')
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          choco install gh -y
        else
          brew install gh || (which apt && sudo apt update && sudo apt install gh -y)
        fi
      shell: bash


    # Delete Failed Release & Tag if unsuccessful - Tag Only
    # ==========================================================================================
    - name: Remove GitHub Tag and Release on Failure
      if: failure() && startsWith(github.ref, 'refs/tags/v')
      shell: bash  # Explicitly specify bash shell
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        echo "Cleaning up failed release and tag: $TAG_NAME"
        
        # Delete GitHub release (if exists)
        RELEASE_ID=$(gh api repos/${GITHUB_REPOSITORY}/releases \
          --jq ".[] | select(.tag_name==\"$TAG_NAME\") | .id")
        
        if [ -n "$RELEASE_ID" ]; then
          echo "Deleting release ID: $RELEASE_ID"
          gh api -X DELETE repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID
        else
          echo "No matching release found for tag: $TAG_NAME"
        fi
        
        # Delete the tag itself
        echo "Deleting tag: $TAG_NAME"
        gh api -X DELETE repos/${GITHUB_REPOSITORY}/git/refs/tags/$TAG_NAME


  # Job: Web Build (Wonderlab)
  # ==========================================================================================
  # Builds the plugin to WebAssembly using the Wonderlab framework and deploys
  # to CaulfieldEngineering.com/plug-ins/{repo_name}/web/
  # ==========================================================================================
  web-build:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

    # Checkout Plugin Code
    # ==========================================================================================
    - name: Checkout Plugin Code
      uses: actions/checkout@v4


    # Checkout Wonderlab Framework
    # ==========================================================================================
    - name: Checkout Wonderlab
      uses: actions/checkout@v4
      with:
        repository: CaulfieldEngineering/Wonderlab
        path: Wonderlab
        token: ${{ secrets.GITHUB_TOKEN }}


    # Read Project Configuration
    # ==========================================================================================
    - name: Read Project Configuration
      shell: bash
      run: |
        echo "Reading configuration from config.cmake..."
        while IFS=' ' read -r key value; do
          value=$(echo $value | tr -d '"')
          echo "$key=$value" >> $GITHUB_ENV
        done < <(grep 'set(w' ${GITHUB_WORKSPACE}/config.cmake | sed -e 's/set(//g' -e 's/)//g' -e 's/\s\+/ /g')


    # Install Emscripten SDK
    # ==========================================================================================
    - name: Install Emscripten SDK
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.61


    # Install Ninja Build System
    # ==========================================================================================
    - name: Install Ninja
      run: sudo apt-get install -y ninja-build


    # Generate BinaryData (native CMake configure only)
    # ==========================================================================================
    - name: Generate BinaryData
      run: |
        echo "Running native CMake configure to generate BinaryData.h..."
        cmake -S . -B build -DBUILD_DEMO=OFF
        echo "BinaryData.h generated."


    # Build WebAssembly
    # ==========================================================================================
    - name: Build WebAssembly
      env:
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      shell: bash
      run: |
        set -e

        WONDERLAB_DIR="${GITHUB_WORKSPACE}/Wonderlab"
        PLUGIN_SRC_DIR="${GITHUB_WORKSPACE}/plugin/source"
        WEB_BUILD_DIR="${GITHUB_WORKSPACE}/build/web"
        BINARY_DATA_DIR="${GITHUB_WORKSPACE}/build/plugin/images/juce_binarydata_${REPOSITORY_NAME}BinaryData/JuceLibraryCode"

        echo "Plugin:  ${wPLUGIN_NAME} v${wPROJECT_VERSION}"
        echo "Sources: ${PLUGIN_SRC_DIR}"
        echo ""

        # Verify BinaryData was generated
        if [ ! -f "${BINARY_DATA_DIR}/BinaryData.h" ]; then
          echo "ERROR: BinaryData.h not found at ${BINARY_DATA_DIR}"
          echo "Contents of build/plugin/images/:"
          find ${GITHUB_WORKSPACE}/build/plugin/images/ -name "BinaryData.h" 2>/dev/null || echo "Not found anywhere"
          exit 1
        fi

        # Create build directory
        mkdir -p "${WEB_BUILD_DIR}"
        cd "${WEB_BUILD_DIR}"

        # Generate CMakeLists.txt
        echo "Generating CMakeLists.txt..."
        cat > CMakeLists.txt <<EOF
        cmake_minimum_required(VERSION 3.15)
        project(${REPOSITORY_NAME}Web LANGUAGES C CXX)
        set(CMAKE_CXX_STANDARD 20)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)

        set(PLUGIN_NAME "${wPLUGIN_NAME}")
        set(PLUGIN_VERSION "${wPROJECT_VERSION}")
        set(PLUGIN_SRC_DIR "${PLUGIN_SRC_DIR}")
        set(WONDERLAB_DIR "${WONDERLAB_DIR}")
        set(PLUGIN_PROCESSOR_HEADER "PluginProcessor.h")
        set(PLUGIN_PROCESSOR_CLASS audio_plugin::AudioPluginAudioProcessor)
        set(PLUGIN_EXTRA_INCLUDE_DIRS "${BINARY_DATA_DIR}")
        set(PLUGIN_EXTRA_SOURCE_DIRS "${BINARY_DATA_DIR}")

        include(\${WONDERLAB_DIR}/cmake/WonderlabBuild.cmake)
        EOF

        # Configure with Emscripten
        echo "Configuring Emscripten..."
        emcmake cmake -G Ninja -S . -B . -DCMAKE_BUILD_TYPE=Release

        # Build
        echo "Compiling WebAssembly..."
        emmake ninja

        WASM_SIZE=$(stat -c%s "${REPOSITORY_NAME}Web.wasm" 2>/dev/null || echo "unknown")
        echo "WASM size: ${WASM_SIZE} bytes"


    # Assemble Web App
    # ==========================================================================================
    - name: Assemble Web App
      env:
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      shell: bash
      run: |
        set -e

        WONDERLAB_DIR="${GITHUB_WORKSPACE}/Wonderlab"
        WEB_BUILD_DIR="${GITHUB_WORKSPACE}/build/web"
        SAMPLE_DIR="${GITHUB_WORKSPACE}/plugin/sample_audio"

        echo "Assembling web app..."

        # Copy Wonderlab web host files
        cp "${WONDERLAB_DIR}/web/index.html" "${WEB_BUILD_DIR}/index.html"
        cp "${WONDERLAB_DIR}/web/juce-audio-worklet.js" "${WEB_BUILD_DIR}/juce-audio-worklet.js"

        # Copy sample audio tracks
        TRACK_LIST=""
        if [ -d "${SAMPLE_DIR}" ]; then
          echo "Copying sample audio tracks..."
          mkdir -p "${WEB_BUILD_DIR}/audio"
          for f in "${SAMPLE_DIR}"/*; do
            [ -f "$f" ] || continue
            cp "$f" "${WEB_BUILD_DIR}/audio/"
            fname=$(basename "$f")
            title="${fname%.*}"
            if [ -n "${TRACK_LIST}" ]; then
              TRACK_LIST="${TRACK_LIST}, { title: '${title}', file: 'audio/${fname}' }"
            else
              TRACK_LIST="{ title: '${title}', file: 'audio/${fname}' }"
            fi
            echo "  + ${fname}"
          done
        else
          echo "No sample_audio folder found."
        fi

        # Generate plugin-config.js
        echo "Generating plugin-config.js..."
        cat > "${WEB_BUILD_DIR}/plugin-config.js" <<JSEOF
        window.WONDERLAB_CONFIG = {
            pluginName: '${wPLUGIN_NAME}',
            pluginWidth: 750,
            pluginHeight: 515,
            wasmJs: '${wPLUGIN_NAME}Web.js',
            tracks: [${TRACK_LIST}]
        };
        JSEOF

        # List final web app contents
        echo ""
        echo "Web app contents:"
        ls -la "${WEB_BUILD_DIR}/"
        if [ -d "${WEB_BUILD_DIR}/audio" ]; then
          ls -la "${WEB_BUILD_DIR}/audio/"
        fi


    # Check SSH Credentials for Web Deploy
    # ==========================================================================================
    - name: Check SSH Credentials (Web)
      id: check_ssh_web
      shell: bash
      run: |
        if [ -z "${{ secrets.SSH_ID }}" ] || [ "${{ secrets.SSH_ID }}" = "SKIP" ]; then
          echo "ssh_available=false" >> $GITHUB_OUTPUT
          echo "SSH credentials not set. Skipping web deploy."
        else
          echo "ssh_available=true" >> $GITHUB_OUTPUT
        fi


    # Setup SSH for Web Deploy
    # ==========================================================================================
    - name: Setup SSH (Web)
      if: steps.check_ssh_web.outputs.ssh_available == 'true'
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_ID }}


    # Add Host Key (Web)
    # ==========================================================================================
    - name: Add Host Key (Web)
      if: steps.check_ssh_web.outputs.ssh_available == 'true'
      shell: bash
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -p 7822 CaulfieldEngineering.com >> ~/.ssh/known_hosts


    # Create SSH Config (Web)
    # ==========================================================================================
    - name: Create SSH Config (Web)
      if: steps.check_ssh_web.outputs.ssh_available == 'true'
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "Host CaulfieldEngineering.com
          HostName CaulfieldEngineering.com
          User caulfiel
          Port 7822
          MACs hmac-sha2-256
          StrictHostKeyChecking no" > ~/.ssh/config


    # Deploy Web App to Server
    # ==========================================================================================
    - name: Deploy Web App to Server
      if: steps.check_ssh_web.outputs.ssh_available == 'true'
      env:
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      shell: bash
      run: |
        set -e

        WEB_BUILD_DIR="${GITHUB_WORKSPACE}/build/web"
        SERVER="CaulfieldEngineering.com"
        DEST_PATH="/home/caulfiel/public_html/plug-ins/${REPOSITORY_NAME}/web/"

        echo "Deploying web app to ${SERVER}:${DEST_PATH}..."

        # Create destination directory
        ssh $SERVER "mkdir -p ${DEST_PATH} ${DEST_PATH}audio/"

        # Upload web app files (excluding build artifacts)
        echo "Uploading web host files..."
        scp "${WEB_BUILD_DIR}/index.html" "$SERVER:${DEST_PATH}"
        scp "${WEB_BUILD_DIR}/plugin-config.js" "$SERVER:${DEST_PATH}"
        scp "${WEB_BUILD_DIR}/juce-audio-worklet.js" "$SERVER:${DEST_PATH}"
        scp "${WEB_BUILD_DIR}/${REPOSITORY_NAME}Web.js" "$SERVER:${DEST_PATH}"
        scp "${WEB_BUILD_DIR}/${REPOSITORY_NAME}Web.wasm" "$SERVER:${DEST_PATH}"

        # Upload audio samples
        if [ -d "${WEB_BUILD_DIR}/audio" ]; then
          echo "Uploading audio samples..."
          scp "${WEB_BUILD_DIR}/audio/"* "$SERVER:${DEST_PATH}audio/"
        fi

        # Upload COOP/COEP headers file (.htaccess for Apache)
        echo "Configuring server headers..."
        cat > /tmp/htaccess_web <<'HTEOF'
        # Required for SharedArrayBuffer (Web Audio + WASM)
        Header set Cross-Origin-Opener-Policy "same-origin"
        Header set Cross-Origin-Embedder-Policy "require-corp"
        Header set Cache-Control "no-cache, no-store, must-revalidate"

        # MIME types
        AddType application/wasm .wasm
        AddType application/javascript .js
        HTEOF
        scp /tmp/htaccess_web "$SERVER:${DEST_PATH}.htaccess"

        echo ""
        echo "==========================================================================="
        echo "  Web app deployed!"
        echo "  URL: https://caulfieldengineering.com/plug-ins/${REPOSITORY_NAME}/web/"
        echo "==========================================================================="
